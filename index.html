<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kallol Chakrabarti | Concept Architect for Independent Researchers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&display=swap');

        :root {
            --gold: #D4A853;
            --gold-light: #F0D68A;
            --gold-dark: #B8860B;
            --deep-navy: #0A0E27;
            --navy: #101840;
            --dark-blue: #1A2555;
            --saffron: #FF6B00;
            --saffron-light: #FF9248;
            --white: #FFFFFF;
            --silver: #C0C5D0;
            --light-gray: #E8EAF0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--deep-navy);
            color: var(--white);
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 8s infinite;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            20% { opacity: 0.6; }
            80% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.5); }
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(170deg, #0A0E27 0%, #101840 30%, #1A2555 60%, #0A0E27 100%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(212,168,83,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 20% 80%, rgba(255,107,0,0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(212,168,83,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 950px;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.5rem 1.8rem;
            border: 1px solid var(--gold);
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease 0.3s both;
        }

        .hero-icon {
            width: 140px;
            height: 140px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(212,168,83,0.3), 0 0 120px rgba(212,168,83,0.1);
            animation: fadeInDown 1s ease 0.5s both;
            position: relative;
        }

        .hero-icon::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(212,168,83,0.3);
            animation: pulse-ring 2.5s infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .hero-icon svg {
            width: 70px;
            height: 70px;
            fill: var(--deep-navy);
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark), var(--gold-light));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite, fadeInDown 1s ease 0.7s both;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .hero h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            color: var(--silver);
            margin-bottom: 1.5rem;
            animation: fadeInDown 1s ease 0.9s both;
        }

        .hero h2 span {
            color: var(--saffron);
            font-weight: 700;
        }

        .hero-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.7);
            max-width: 700px;
            margin: 0 auto 2.5rem;
            animation: fadeInUp 1s ease 1.1s both;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease 1.3s both;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--silver);
            margin-top: 0.3rem;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            z-index: 2;
        }

        .scroll-indicator svg {
            width: 30px;
            height: 30px;
            fill: var(--gold);
            opacity: 0.6;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Styles */
        section {
            position: relative;
            z-index: 1;
            padding: 6rem 2rem;
        }

        .section-header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 4rem;
        }

        .section-tag {
            display: inline-block;
            padding: 0.4rem 1.5rem;
            background: rgba(212,168,83,0.1);
            border: 1px solid rgba(212,168,83,0.3);
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: var(--white);
            margin-bottom: 1rem;
        }

        .section-title span {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            font-size: 1.05rem;
            color: var(--silver);
            line-height: 1.7;
        }

        /* Download Stats Banner */
        .download-stats-banner {
            background: linear-gradient(135deg, rgba(26,37,85,0.95), rgba(16,24,64,0.98));
            border: 2px solid rgba(212,168,83,0.35);
            border-radius: 20px;
            max-width: 1100px;
            margin: 0 auto 4rem;
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .download-stats-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--saffron), var(--gold), var(--saffron-light), var(--gold));
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }

        .download-stats-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(212,168,83,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .download-banner-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .download-banner-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--silver);
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .download-stats-grid {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .download-stat-item {
            text-align: center;
            padding: 1.5rem 2rem;
            background: rgba(212,168,83,0.06);
            border: 1px solid rgba(212,168,83,0.2);
            border-radius: 16px;
            min-width: 160px;
            transition: all 0.3s;
        }

        .download-stat-item:hover {
            transform: translateY(-4px);
            border-color: rgba(212,168,83,0.5);
            box-shadow: 0 10px 30px rgba(212,168,83,0.1);
        }

        .download-stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .download-stat-number {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold);
            line-height: 1.2;
        }

        .download-stat-label {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--silver);
            margin-top: 0.3rem;
        }

        /* Contributions Grid */
        .contributions {
            background: linear-gradient(180deg, var(--deep-navy) 0%, #0D1230 50%, var(--deep-navy) 100%);
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        /* Button Card Styles */
        .btn-card {
            position: relative;
            display: block;
            text-decoration: none;
            padding: 2rem 2rem 2rem 2rem;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(26,37,85,0.8), rgba(16,24,64,0.9));
            border: 1px solid rgba(212,168,83,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            cursor: pointer;
        }

        .btn-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--saffron), var(--gold));
            background-size: 200% auto;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .btn-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(212,168,83,0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .btn-card:hover {
            transform: translateY(-6px);
            border-color: rgba(212,168,83,0.5);
            box-shadow: 0 20px 60px rgba(212,168,83,0.15), 0 0 40px rgba(212,168,83,0.05);
        }

        .btn-card:hover::before {
            opacity: 1;
            animation: shimmer 2s linear infinite;
        }

        .btn-card:hover::after {
            opacity: 1;
        }

        .btn-card-icon {
            position: relative;
            z-index: 1;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            font-size: 1.5rem;
            transition: transform 0.4s;
        }

        .btn-card:hover .btn-card-icon {
            transform: scale(1.1);
        }

        .icon-saffron { background: linear-gradient(135deg, rgba(255,107,0,0.2), rgba(255,146,72,0.1)); color: var(--saffron); }
        .icon-gold { background: linear-gradient(135deg, rgba(212,168,83,0.2), rgba(240,214,138,0.1)); color: var(--gold); }
        .icon-blue { background: linear-gradient(135deg, rgba(66,133,244,0.2), rgba(66,133,244,0.1)); color: #4285F4; }
        .icon-green { background: linear-gradient(135deg, rgba(52,168,83,0.2), rgba(52,168,83,0.1)); color: #34A853; }
        .icon-purple { background: linear-gradient(135deg, rgba(156,39,176,0.2), rgba(156,39,176,0.1)); color: #AB47BC; }
        .icon-red { background: linear-gradient(135deg, rgba(234,67,53,0.2), rgba(234,67,53,0.1)); color: #EA4335; }
        .icon-teal { background: linear-gradient(135deg, rgba(0,150,136,0.2), rgba(0,150,136,0.1)); color: #009688; }
        .icon-indigo { background: linear-gradient(135deg, rgba(63,81,181,0.2), rgba(63,81,181,0.1)); color: #5C6BC0; }
        .icon-github { background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(200,200,200,0.1)); color: #FFFFFF; }
        .icon-netlify { background: linear-gradient(135deg, rgba(0,200,159,0.2), rgba(0,200,159,0.1)); color: #00C7B7; }

        .btn-card-category {
            position: relative;
            z-index: 1;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.6rem;
        }

        .btn-card-title {
            position: relative;
            z-index: 1;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 0.7rem;
            line-height: 1.4;
            transition: color 0.3s;
        }

        .btn-card:hover .btn-card-title {
            color: var(--gold-light);
        }

        .btn-card-desc {
            position: relative;
            z-index: 1;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.55);
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }

        .btn-card-link {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--saffron);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: gap 0.3s;
        }

        .btn-card:hover .btn-card-link {
            gap: 0.9rem;
        }

        .btn-card-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s;
        }

        .btn-card:hover .btn-card-link svg {
            transform: translateX(3px);
        }

        /* Highlighted GitHub & Netlify Cards */
        .btn-card.highlight-github {
            border: 2px solid rgba(255,255,255,0.35);
            background: linear-gradient(145deg, rgba(30,30,50,0.95), rgba(20,20,40,0.98));
        }

        .btn-card.highlight-github:hover {
            border-color: rgba(255,255,255,0.7);
            box-shadow: 0 20px 60px rgba(255,255,255,0.08), 0 0 40px rgba(255,255,255,0.03);
        }

        .btn-card.highlight-github .btn-card-link {
            color: #FFFFFF;
        }

        .btn-card.highlight-netlify {
            border: 2px solid rgba(0,199,183,0.35);
            background: linear-gradient(145deg, rgba(10,35,45,0.95), rgba(10,25,35,0.98));
        }

        .btn-card.highlight-netlify:hover {
            border-color: rgba(0,199,183,0.7);
            box-shadow: 0 20px 60px rgba(0,199,183,0.12), 0 0 40px rgba(0,199,183,0.04);
        }

        .btn-card.highlight-netlify .btn-card-link {
            color: #00C7B7;
        }

        /* Featured Card - spans full width */
        .btn-card.featured {
            grid-column: 1 / -1;
            background: linear-gradient(145deg, rgba(26,37,85,0.9), rgba(16,24,64,0.95));
            border-color: rgba(212,168,83,0.3);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2rem;
            padding: 3rem;
        }

        .featured-left {
            flex: 1;
            min-width: 280px;
        }

        .featured-right {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .featured-stat {
            text-align: center;
        }

        .featured-stat-num {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold);
        }

        .featured-stat-label {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--silver);
        }

        /* Nation Building Section */
        .nation-building {
            background: linear-gradient(180deg, var(--deep-navy) 0%, #0F1635 100%);
        }

        .pillars {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .pillar {
            text-align: center;
            padding: 2.5rem 1.5rem;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(26,37,85,0.6), rgba(16,24,64,0.7));
            border: 1px solid rgba(212,168,83,0.1);
            transition: all 0.3s;
        }

        .pillar:hover {
            transform: translateY(-4px);
            border-color: rgba(212,168,83,0.3);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .pillar-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .pillar h3 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .pillar p {
            font-size: 0.85rem;
            color: var(--silver);
            line-height: 1.5;
        }

        /* Academic Section */
        .academic-section {
            background: linear-gradient(180deg, #0F1635 0%, var(--deep-navy) 100%);
        }

        .academic-grid {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            gap: 1.5rem;
        }

        .academic-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.8rem
